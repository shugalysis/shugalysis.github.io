<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --grape: #5B2EFF;
      --lemon: #FFE14D;
      --gum: #FF7AC6;
      --ink: #1A1033;
      --lilac: #F1ECFF;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Onest", system-ui, sans-serif; background: var(--lilac); color: var(--ink); font-size: 18px; line-height: 1.65; }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid var(--gum); outline-offset: 3px; border-radius: 6px; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 32px; }
    .display { font-family: "Bagel Fat One", sans-serif; font-weight: 400; line-height: 1.05; }

    .nav { display: flex; justify-content: space-between; align-items: center; padding: 22px 0; }
    .logo { font-family: "Bagel Fat One", sans-serif; font-size: 26px; text-decoration: none; }
    .nav ul { display: flex; gap: 22px; list-style: none; }
    .nav ul a { text-decoration: none; font-weight: 700; }
    .nav ul a:hover { text-decoration: underline wavy var(--gum); text-underline-offset: 5px; }

    .hero { background: var(--grape); color: var(--white); border: 3px solid var(--ink); border-radius: 32px; padding: 72px 56px 56px; margin: 8px 0 64px; position: relative; }
    .wordmark { color: var(--lemon); font-size: clamp(46px, 12vw, 150px); text-shadow: 7px 7px 0 var(--ink); overflow-wrap: anywhere; }
    .tagline { max-width: 34ch; font-size: 21px; margin: 18px 0 28px; }
    .sticker { position: absolute; background: var(--gum); color: var(--ink); border: 3px solid var(--ink); border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: 15px; }
    .s1 { top: -18px; right: 28px; transform: rotate(6deg); }
    .s2 { bottom: -18px; left: 30px; transform: rotate(-4deg); background: var(--lemon); }
    .xp { max-width: 420px; }
    .xp-top { display: flex; justify-content: space-between; font-size: 15px; font-weight: 500; margin-bottom: 8px; }
    .bar { height: 18px; background: var(--white); border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; }
    .bar span { display: block; height: 100%; width: 22%; background: var(--lemon); border-right: 3px solid var(--ink); animation: fill 1.4s ease-out both; }
    @keyframes fill { from { width: 0; } }

    h2.section { font-size: 34px; margin: 0 0 20px; }
    .drops { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 22px; margin-bottom: 64px; }
    .drop { display: block; text-decoration: none; background: var(--white); border: 3px solid var(--ink); border-radius: 20px; padding: 22px 24px; box-shadow: 6px 6px 0 var(--ink); transition: transform .15s, box-shadow .15s; }
    .drop:hover { transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--gum); }
    .drop h3 { font-family: "Bagel Fat One", sans-serif; font-weight: 400; font-size: 26px; line-height: 1.15; margin: 8px 0 6px; }
    .drop p { font-size: 17px; }
    .tag { display: inline-block; background: var(--lemon); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 12px; font-size: 14px; font-weight: 700; }
    .soon .drop { background: transparent; border-style: dashed; box-shadow: none; }
    .soon .drop:hover { transform: none; box-shadow: none; }
    .empty { font-weight: 500; margin-bottom: 40px; }

    .article { padding: 24px 0 64px; }
    .article h1 { font-size: clamp(38px, 7vw, 60px); margin: 12px 0 14px; }
    .meta { font-weight: 500; margin-bottom: 32px; }
    .prose { max-width: 66ch; }
    .prose p, .prose ul, .prose ol { margin: 0 0 1.2em; }
    .prose li { margin-left: 1.2em; margin-bottom: .4em; }
    .prose h2 { font-family: "Bagel Fat One", sans-serif; font-weight: 400; font-size: 30px; line-height: 1.15; margin: 1.6em 0 .5em; }
    .prose a { color: var(--grape); text-decoration-thickness: 2px; text-underline-offset: 3px; font-weight: 500; }
    .prose blockquote { background: var(--lemon); border: 3px solid var(--ink); border-radius: 16px; padding: 16px 20px; margin: 1.6em 0; font-weight: 500; }
    .prose img { max-width: 100%; border: 3px solid var(--ink); border-radius: 16px; }
    .back { display: inline-block; margin-top: 40px; font-weight: 700; }

    footer { border-top: 3px solid var(--ink); padding: 28px 0 48px; font-size: 15px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

    @media (max-width: 600px) {
      body { font-size: 17px; }
      .hero { padding: 40px 22px 32px; }
      .nav ul { gap: 14px; }
      .s1 { right: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar span { animation: none; }
      .drop { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="logo" href="{{ '/' | relative_url }}">shugalysis</a>
      <ul>
        <li><a href="{{ '/' | relative_url }}">Writing</a></li>
        <li><a href="{{ '/about/' | relative_url }}">About</a></li>
        <li><a href="{{ site.linkedin }}">LinkedIn</a></li>
      </ul>
    </nav>
    <main>
      {{ content }}
    </main>
    <footer>
      <span>Shugalysis. Product notes from the gaming D2C trenches.</span>
      <a href="{{ site.linkedin }}">Say hi on LinkedIn</a>
    </footer>
  </div>
</body>
</html>
